<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RizzShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <h1>RizzShop onde voçê encontra o seu carro de sonhos.</h1>
    <h2>Faça o seu cadastro para realizar a sua compra de sonho!</h2>
<fieldset>
    <form action="">
        <label for="campo_nome">Nome:</label>
        <input  id="campo_nome" type="text" placeholder="Digite o seu nome" required><br><br>

        <label for="campo_idade">Idade:</label>
        <input  id="campo_idade" type="number" placeholder="Digite  a sua idade" required><br><br>

        <label for="campo_genero">Genero:</label>
        <select name="" id="" required>
            <option value="" selected disabled>Selecione uma opção</option>
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
        </select><br><br>

        <label for="campo_email">Email:</label>
        <input  id="campo_email" type="email" placeholder="Digite o seu email" required><br><br>

        <label for="campo_senha">Senha:</label>
        <input  id="campo_senha" type="password" placeholder="Digite a sua senha" required><br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</fieldset><br><br>

<a href="boa_vindas.html">Login</a><br>
</body>
</html>
